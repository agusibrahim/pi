name: 'Manual: Sync, Build & Publish'

# Manual entry point for building and publishing patched pi binaries with
# selectable platform toggles (linux, mac, windows) so you can build only
# the platform(s) you need.

on:
  workflow_dispatch:
    inputs:
      linux:
        description: 'Build Linux binaries (linux-x64, linux-arm64)'
        type: boolean
        default: true
      mac:
        description: 'Build macOS binaries (darwin-arm64, darwin-x64)'
        type: boolean
        default: true
      windows:
        description: 'Build Windows binaries (windows-x64, windows-arm64)'
        type: boolean
        default: false
      sync:
        description: 'Merge upstream main into this branch first'
        type: boolean
        default: true
      publish:
        description: 'Update the rolling GitHub Release'
        type: boolean
        default: true

permissions:
  # actions: write is needed to dispatch another workflow.
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch patched build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build-patched.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_WORKFLOW: build-patched.yml
          TARGET_REF: ${{ github.ref_name }}
          LINUX: ${{ inputs.linux }}
          MAC: ${{ inputs.mac }}
          WINDOWS: ${{ inputs.windows }}
          SYNC: ${{ inputs.sync }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          args=(
            --ref "${TARGET_REF}"
            -f "linux=${LINUX}"
            -f "mac=${MAC}"
            -f "windows=${WINDOWS}"
            -f "sync=${SYNC}"
            -f "publish=${PUBLISH}"
          )

          echo "dispatching ${TARGET_WORKFLOW} (ref=${TARGET_REF}, linux=${LINUX}, mac=${MAC}, windows=${WINDOWS}, sync=${SYNC}, publish=${PUBLISH})"
          gh workflow run "${TARGET_WORKFLOW}" "${args[@]}"

          sleep 5
          gh run list --workflow "${TARGET_WORKFLOW}" --limit 1 \
            --json databaseId,status,event,url -q '.[] | "run \(.databaseId) \(.event) \(.status)\n\(.url)"'
