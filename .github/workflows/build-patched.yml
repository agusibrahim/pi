name: Build Patched (macOS)

# Builds pi from this fork with patches/google-aas.patch applied. The patch adds
# Android AAS sign-in to the google provider; without it the fork is byte-for-byte
# upstream pi, so upstream stays easy to sync with.

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/build-patched.yml'
      - 'packages/ai/**'
      - 'scripts/build-coding-agent-bundle.mjs'
  # Weekly upstream sync, then rebuild so the rolling release binary never goes
  # stale. Every Monday 05:17 UTC; change the cron to move the day.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      sync:
        description: 'Merge upstream main into this branch before building'
        type: boolean
        default: true
      publish:
        description: 'Update the rolling GitHub Release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-patched-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs only on schedule and on a manual dispatch that asked for it. Merges
  # upstream so the fork tracks pi, then pushes with [skip ci] so the push does
  # not also fire the matrix below; this run does the build instead.
  sync_upstream:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the merge can reach upstream commits and so the patch
          # keeps the blobs it needs for a three-way apply.
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream main
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream https://github.com/earendil-works/pi.git
          git fetch --no-tags upstream main

          before="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          echo "fork    : ${before}"
          echo "upstream: ${upstream_sha}"

          if git merge-base --is-ancestor "${upstream_sha}" "${before}"; then
            echo "already up to date with upstream"
            echo "sync_status=uptodate" >> "${GITHUB_ENV}"
            exit 0
          fi

          # Keep the message on one source line: a bare continuation line would
          # terminate this YAML block scalar.
          merge_message="$(printf 'chore: merge upstream main into fork\n\n[skip ci]\n')"

          if ! git merge --no-ff --no-edit -m "${merge_message}" "${upstream_sha}"; then
            git merge --abort || true
            printf '%s\n' \
              '' \
              '::error::Merging upstream main conflicts. Resolve locally, then push:' \
              '' \
              '  git remote add upstream https://github.com/earendil-works/pi.git' \
              '  git fetch upstream main' \
              '  git merge upstream/main' \
              '  git push origin main' \
              '' \
              '::error::Then regenerate patches/google-aas.patch from the merged tree if it no longer applies.' \
              >&2
            exit 1
          fi

          git push origin HEAD:main
          echo "sync_status=merged" >> "${GITHUB_ENV}"
          echo "merged ${before}..${upstream_sha}"

      - name: Summarise
        run: |
          echo "sync status: ${sync_status}"
          git log --oneline -1

  build:
    name: ${{ matrix.label }}
    needs: sync_upstream
    # `needs` with a skipped job would skip this too, so opt back in explicitly.
    if: ${{ !cancelled() && needs.sync_upstream.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    # contents: write is only needed to publish the rolling GitHub Release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-arm64
            runner: macos-latest
            platform: darwin-arm64
          # macOS-only for now so the run stays short. Uncomment a target to add it
          # back; every entry needs a runner that can compile for `platform`.
          # - label: darwin-x64
          #   runner: macos-13
          #   platform: darwin-x64
          # - label: linux-x64
          #   runner: ubuntu-latest
          #   platform: linux-x64
          # - label: linux-arm64
          #   runner: ubuntu-24.04-arm
          #   platform: linux-arm64
          # - label: windows-x64
          #   runner: windows-latest
          #   platform: windows-x64
          # - label: windows-arm64
          #   runner: windows-11-arm
          #   platform: windows-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Apply Google AAS patch
        run: |
          set -euo pipefail

          # Already-applied is a no-op so re-running a green build stays green.
          if git apply --reverse --check patches/google-aas.patch; then
            echo "patch already applied, skipping"
          else
            # Three-way so an upstream bump that merely moved the context still
            # merges instead of failing on a stale hunk.
            git apply --3way patches/google-aas.patch
          fi

          # The bundle build refuses to run when a lazily imported OAuth flow has no
          # lazy bundle entry, so fail here with a clear message instead. `git apply
          # --3way` stages its result, so this has to diff against HEAD, not the index.
          git diff --name-only HEAD | grep -qx 'scripts/build-coding-agent-bundle.mjs' \
            || { echo '::error::patch did not touch scripts/build-coding-agent-bundle.mjs; the bundle build will fail'; exit 1; }

      - name: Verify patch landed
        run: |
          set -euo pipefail

          test -f packages/ai/src/auth/oauth/google.ts
          grep -q 'android.googleapis.com/auth' packages/ai/src/auth/oauth/google.ts
          grep -q 'oauth: lazyOAuth' packages/ai/src/providers/google.ts
          echo "patched files:"
          git status --porcelain

      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check
        run: npm run check

      - name: Test the patch
        run: |
          set -euo pipefail
          node ./node_modules/vitest/dist/cli.js \
            --root packages/ai \
            --run test/google-oauth.test.ts test/google-oauth-bearer.test.ts

      - name: Build ${{ matrix.platform }} binary
        run: |
          set -euo pipefail
          ./scripts/build-binaries.sh \
            --skip-install \
            --offline-model-data \
            --platform "${{ matrix.platform }}" \
            --out "${{ github.workspace }}/build-out"

      - name: Verify the binary carries the patch
        shell: bash
        run: |
          set -euo pipefail

          binary="${{ github.workspace }}/build-out/${{ matrix.platform }}/pi"
          test -x "$binary" || { ls -R "${{ github.workspace }}/build-out"; exit 1; }

          "$binary" --version

          # The compiled bundle must contain the AAS exchange, otherwise the build
          # silently produced an unpatched pi.
          if ! grep -aq 'android.googleapis.com/auth' "$binary"; then
            echo '::error::built binary does not contain the AAS token exchange'
            exit 1
          fi

      - name: Upload patched binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-patched-${{ matrix.platform }}
          path: |
            build-out/${{ matrix.platform }}/pi
            build-out/pi-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        # Publish on push and schedule; only an explicit dispatch can opt out.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != false }}
        # Rolling release: one tag per platform that always holds the newest
        # successful build, so `releases/download/<tag>/` stays a stable URL
        # instead of producing a release per commit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: patched-${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail

          archive="build-out/pi-${{ matrix.platform }}.tar.gz"
          sha="$(sha256sum "${archive}" | cut -d' ' -f1)"

          notes="$(cat <<NOTES
          Patched pi for ${{ matrix.platform }}, built from this fork with
          \`patches/google-aas.patch\` applied.

          - commit: \`${GITHUB_SHA}\`
          - workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - sha256: \`${sha}\`

          The build fails if the compiled binary does not contain the Android AAS
          token exchange, so an asset here always carries the patch.

          macOS Gatekeeper quarantines downloaded binaries:
          \`xattr -dr com.apple.quarantine pi\` after extracting, then \`chmod +x pi\`.
          NOTES
          )"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "updating existing release ${RELEASE_TAG}"
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes "${notes}" --prerelease
          else
            echo "creating release ${RELEASE_TAG}"
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes "${notes}" --prerelease
          fi

          gh release upload "${RELEASE_TAG}" "${archive}" --clobber
          printf '%s  %s\n' "${sha}" "$(basename "${archive}")" > "build-out/SHA256SUMS-${RELEASE_TAG}.txt"
          gh release upload "${RELEASE_TAG}" "build-out/SHA256SUMS-${RELEASE_TAG}.txt" --clobber